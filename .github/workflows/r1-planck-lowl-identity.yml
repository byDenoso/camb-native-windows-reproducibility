name: r1-planck-lowl-public-identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1-planck-lowl-identity.yml'
      - 'tests/test_planck_lowl_acquisition_fallback.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planck-lowl-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and download official Planck 2018 baseline likelihood data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/r1-action .r1/planck
          python - <<'PY'
          from html.parser import HTMLParser
          import hashlib, json, pathlib, tarfile, time
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          NAME='COM_Likelihood_Data-baseline_R3.00.tar.gz'
          IRSA_INDEX='https://irsa.ipac.caltech.edu/data/Planck/release_3/software/'
          ESA=[
              'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID='+NAME,
              'https://pla.esac.esa.int/pla-sl/data-action?COSMOLOGY.FILE_ID='+NAME,
          ]
          out=pathlib.Path('.r1')/NAME

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=='a':
                      href=dict(attrs).get('href')
                      if href: self.hrefs.append(href)

          def get(url, timeout=60):
              return urlopen(Request(url, headers={'User-Agent':'ASCOM-00323-reproducibility/1.0'}), timeout=timeout)

          candidates=[]
          discovery_errors=[]
          try:
              with get(IRSA_INDEX, 30) as r:
                  html=r.read().decode('utf-8','replace')
              parser=Links(); parser.feed(html)
              for href in parser.hrefs:
                  absolute=urljoin(IRSA_INDEX,href)
                  if NAME.lower() in absolute.lower() or ('likelihood' in absolute.lower() and 'baseline' in absolute.lower() and 'r3.00' in absolute.lower()):
                      candidates.append(('NASA/IPAC IRSA PR3',absolute))
          except Exception as exc:
              discovery_errors.append({'source':'NASA/IPAC IRSA PR3 index','error':repr(exc)})

          # IRSA first because it is an official U.S. PR3 archive and independent of the ESA endpoint.
          for url in ESA:
              candidates.append(('ESA Planck Legacy Archive',url))

          # Preserve order while deduplicating URLs.
          seen=set(); unique=[]
          for source,url in candidates:
              if url not in seen:
                  seen.add(url); unique.append((source,url))

          attempts=[]; selected=None
          for source,url in unique:
              for attempt in range(1,4):
                  try:
                      temp=out.with_suffix(out.suffix+'.part')
                      if temp.exists(): temp.unlink()
                      h=hashlib.sha256(); size=0
                      with get(url, 120) as response, temp.open('wb') as handle:
                          while True:
                              block=response.read(1024*1024)
                              if not block: break
                              handle.write(block); h.update(block); size += len(block)
                      # Reject HTML/error bodies and unrelated Planck products before promotion.
                      with tarfile.open(temp,'r:gz') as tf:
                          has_lowl=any('plc_3.0/low_l/' in m.name.replace('\\','/') for m in tf.getmembers())
                      if not has_lowl:
                          raise RuntimeError('downloaded archive contains no plc_3.0/low_l subtree')
                      temp.replace(out)
                      selected={'source':source,'url':url,'bytes':size,'sha256':h.hexdigest()}
                      break
                  except Exception as exc:
                      attempts.append({'source':source,'url':url,'attempt':attempt,'error':repr(exc)})
                      if attempt < 3: time.sleep(3*attempt)
              if selected: break

          if not selected:
              pathlib.Path('results/r1-action/planck-acquisition-failure.json').write_text(json.dumps({
                  'schema':'ascom-00323-planck-acquisition/v2','status':'failed',
                  'irsa_index':IRSA_INDEX,'discovery_errors':discovery_errors,'attempts':attempts,
              },indent=2,sort_keys=True)+'\n')
              raise SystemExit('all official Planck acquisition paths failed')

          pathlib.Path('results/r1-action/planck-baseline-archive.json').write_text(json.dumps({
              'schema':'ascom-00323-planck-baseline-archive/v2',
              'file':NAME,'status':'downloaded',**selected,
              'discovery_errors':discovery_errors,'failed_attempts':attempts,
          },indent=2,sort_keys=True)+'\n')
          print(json.dumps(selected,indent=2,sort_keys=True))
          PY
      - name: Extract official plc_3.0 low_l subtree only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, tarfile
          archive=pathlib.Path('.r1/COM_Likelihood_Data-baseline_R3.00.tar.gz')
          out=pathlib.Path('.r1/planck')
          with tarfile.open(archive,'r:gz') as tf:
              members=[]
              for m in tf.getmembers():
                  norm=m.name.replace('\\','/').lstrip('./')
                  marker='plc_3.0/low_l/'
                  pos=norm.find(marker)
                  if pos >= 0 and m.isfile():
                      m.name=norm[pos:]
                      members.append(m)
              if not members:
                  raise SystemExit('official archive contains no plc_3.0/low_l files')
              tf.extractall(out,members=members,filter='data')
          print('extracted',len(members),'files')
          PY
      - name: Recompute canonical Planck low-l tree fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          base=pathlib.Path('.r1/planck').resolve()
          files=[]
          for path in sorted(p for p in base.rglob('*') if p.is_file()):
              data=path.read_bytes()
              files.append({'path':path.relative_to(base).as_posix(),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          canonical=json.dumps(files,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode('utf-8')
          report={
              'schema':'ascom-00323-planck-lowl-tree/v1',
              'file_count':len(files),
              'total_bytes':sum(x['size'] for x in files),
              'tree_sha256':hashlib.sha256(canonical).hexdigest(),
              'expected':{'file_count':72,'total_bytes':17321811,'tree_sha256':'391768a25928ba2ecedb585f64464fbbf1f623bddfb57e0f3106b7b8c4ea12c0'},
              'required_paths':[
                  'plc_3.0/low_l/commander/commander_dx12_v3_2_29.clik',
                  'plc_3.0/low_l/simall/simall_100x143_offlike5_EE_Aplanck_B.clik'
              ]
          }
          report['required_paths_present']=all((base/p).exists() for p in report['required_paths'])
          report['status']='verified' if (
              report['file_count']==report['expected']['file_count'] and
              report['total_bytes']==report['expected']['total_bytes'] and
              report['tree_sha256']==report['expected']['tree_sha256'] and
              report['required_paths_present']
          ) else 'failed'
          pathlib.Path('results/r1-action/planck-lowl-tree.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          if report['status']!='verified': raise SystemExit(1)
          PY
      - name: Upload Planck identity receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascom-00323-r1-planck-lowl-${{ github.run_id }}
          path: results/r1-action
          if-no-files-found: warn
