name: r1-public-data-identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1-data-identity.yml'
      - 'scripts/act_public_payload.py'
      - 'scripts/desi_public_identity.py'
      - 'manifests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-data-identity:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reconstruction dependencies
        run: python -m pip install numpy==2.4.4 sacc==2.1.2
      - name: Download official ACT DR6 CMB-only release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force results/r1-action,.r1 | Out-Null
          $url='https://lambda.gsfc.nasa.gov/data/act/pspipe/sacc_files/dr6_data_cmbonly.tar.gz'
          $archive=Join-Path $env:RUNNER_TEMP 'dr6_data_cmbonly.tar.gz'
          curl.exe -L --fail --retry 5 --retry-delay 2 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'ACT download failed' }
          $dest=Join-Path $env:RUNNER_TEMP 'act-public'
          New-Item -ItemType Directory -Force $dest | Out-Null
          tar.exe -xf $archive -C $dest
          if ($LASTEXITCODE -ne 0) { throw 'ACT extraction failed' }
          $fits=Get-ChildItem $dest -Recurse -Filter dr6_data_cmbonly.fits | Select-Object -First 1
          if (-not $fits) { throw 'ACT FITS missing' }
          "R1_ACT_FITS=$($fits.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Reconstruct and hash ACT payload
        shell: pwsh
        run: |
          python scripts/act_public_payload.py $env:R1_ACT_FITS --output .r1/act_dr6_cmbonly.bin --receipt results/r1-action/act-public-reconstruction.json
          if ($LASTEXITCODE -ne 0) { throw 'ACT reconstruction mismatch' }
      - name: Verify DESI DR2 frozen public identity
        shell: pwsh
        run: |
          git clone https://github.com/CobayaSampler/bao_data.git .r1/bao_data
          if ($LASTEXITCODE -ne 0) { throw 'DESI clone failed' }
          git -C .r1/bao_data checkout --detach b7b8a36e9bccb063081f811f323cada21ab5fbdd
          if ($LASTEXITCODE -ne 0) { throw 'DESI checkout failed' }
          python scripts/desi_public_identity.py .r1/bao_data --receipt results/r1-action/desi-public-identity.json
          if ($LASTEXITCODE -ne 0) { throw 'DESI identity mismatch' }
      - name: Upload public-data receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascom-00323-r1-public-data-${{ github.run_id }}
          path: results/r1-action
          if-no-files-found: warn
