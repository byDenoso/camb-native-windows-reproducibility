name: px-cambclass-actplanck-043

on:
  push:
    branches:
      - science/px-cambclass-actplanck-043
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run 043 unit and patch tests
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: pytest -q tests/test_px_cambclass_actplanck_043.py tests/test_px_043_model_reference.py tests/test_px_composite_043_patch.py tests/test_px_composite_043_statefix.py tests/test_px_043_likelihood_adapter.py tests/test_acquire_act_dr6_043.py

  native-act-planck-holdout:
    needs: contract-red-green
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CLIPY_NOJAX: 'True'
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/.r1/camb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and likelihood dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy scipy pytest sacc==2.4 clipy-like==0.15
      - name: Checkout canonical CAMB 1.6.6
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.6.6 https://github.com/cmbant/CAMB.git .r1/camb
          test "$(git -C .r1/camb rev-parse HEAD)" = "3ef0272d6f7ba1231128872e56e6d4c12af8267b"
      - name: Apply PEER early and protected P(X) effective-fluid patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.r1/camb/fortran/camb.f90')
          text=p.read_text()
          old="allocate (TEarlyQuintessence::P%DarkEnergy)"
          assert text.count(old)==1
          p.write_text(text.replace(old,"allocate(TEarlyQuintessence :: P%DarkEnergy)",1))
          PY
          python scripts/peer_axion_twofield_013_patch.py .r1/camb
          python scripts/px_composite_043_patch_v2.py .r1/camb
      - name: Compile patched canonical CAMB
        shell: bash
        run: |
          set -euo pipefail
          cd .r1/camb
          python -m pip install -e . --no-build-isolation
      - name: Acquire verified ACT DR6 payload
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git .r1/DR6-ACT-lite
          git -C .r1/DR6-ACT-lite checkout --detach 627aeafb88ae5ad1aa66b406bea2d65cfa66a27d
          test "$(git -C .r1/DR6-ACT-lite rev-parse HEAD)" = "627aeafb88ae5ad1aa66b406bea2d65cfa66a27d"
          python scripts/acquire_act_dr6_043.py \
            --work .r1/act-dr6-043 \
            --output .r1/act_dr6_source.fits \
            --receipt results/px-043/act-acquisition-receipt.json
          python scripts/act_public_payload.py .r1/act_dr6_source.fits \
            --output .r1/act_dr6_cmbonly.bin \
            --receipt results/px-043/act-receipt.json
      - name: Acquire verified Planck 2018 baseline likelihoods
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acquire_planck_baseline_043.py --work .r1/planck-work --receipt results/px-043/planck-receipt.json
      - name: Execute native 043 ACT and Planck holdout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_px_cambclass_actplanck_043.py \
            --act-payload .r1/act_dr6_cmbonly.bin \
            --planck-root .r1/planck-work/planck/plc_3.0 \
            --camb-source .r1/camb \
            --output results/px-043/px_043_result.json
      - name: Upload 043 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T-DE26-PX-CAMBCLASS-ACTPLANCK-LIKELIHOOD-RUNTIME-043-${{ github.run_id }}
          path: results/px-043/
          if-no-files-found: warn
