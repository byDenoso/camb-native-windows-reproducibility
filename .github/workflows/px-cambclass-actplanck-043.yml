name: px-cambclass-actplanck-043

on:
  push:
    branches:
      - science/px-cambclass-actplanck-043
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run 043 unit and patch tests
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: pytest -q tests/test_px_cambclass_actplanck_043.py tests/test_px_043_model_reference.py tests/test_px_composite_043_patch.py
