name: r1-scientific-closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1-scientific-closure.yml'
      - 'r1_scientific_harness/**'
      - 'scripts/run_r1_scientific_closure.py'
      - 'scripts/run_r1_scientific_closure_v2.py'
      - 'scripts/pantheon_cross_platform.py'
      - 'scripts/windows_fcntl_compat.py'
      - 'scripts/run_r1_core.ps1'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r1-scientific-closure.yml'
      - 'r1_scientific_harness/**'
      - 'scripts/run_r1_scientific_closure.py'
      - 'scripts/run_r1_scientific_closure_v2.py'
      - 'scripts/pantheon_cross_platform.py'
      - 'scripts/windows_fcntl_compat.py'
      - 'scripts/run_r1_core.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-scientific-closure:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact CPython 3.12.13 and core scientific environment
        shell: pwsh
        run: ./scripts/run_r1_core.ps1
      - name: Install historical numerical runtime for scientific closure
        shell: pwsh
        run: |
          $py = Join-Path $env:RUNNER_TEMP 'Python-3.12.13\PCbuild\amd64\python.exe'
          & $py -m pip install numpy==2.5.1 scipy==1.18.0 pandas==3.0.5 psutil==7.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -c "import numpy, scipy, pandas; assert numpy.__version__=='2.5.1'; assert scipy.__version__=='1.18.0'; assert pandas.__version__=='3.0.5'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and verify Microsoft MPI runtime
        shell: pwsh
        run: |
          winget install --id Microsoft.msmpi -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = Join-Path $env:RUNNER_TEMP 'Python-3.12.13\PCbuild\amd64\python.exe'
          & $py -c "from mpi4py import MPI; assert MPI.COMM_WORLD.Get_size() == 1; print(MPI.Get_library_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Align frozen harness and canonical checkout policy
        shell: pwsh
        run: |
          $expected = 'd684c133571822110726409e8bdcc8f646a47e30eb5cf6ca6ad9779d2f3c3b58'
          $script = 'scripts\run_r1_scientific_closure.py'
          $text = Get-Content $script -Raw

          $oldHash = '9a40807f4f42fe49a998544510dc15a8abce7dcad242021fefe5e095e008d46c'
          if ($text -notmatch [regex]::Escape($oldHash) -and $text -notmatch [regex]::Escape($expected)) {
            throw 'scientific executor contains neither the historical nor corrected harness pin'
          }
          $text = $text.Replace($oldHash, $expected)

          $oldPantheon = 'run("git", "checkout", "--detach", PANTHEON_COMMIT, cwd=pan)'
          $newPantheon = 'run("git", "-c", "core.autocrlf=false", "checkout", "--detach", PANTHEON_COMMIT, cwd=pan)'
          if ($text.Contains($oldPantheon)) {
            $text = $text.Replace($oldPantheon, $newPantheon)
          } elseif (-not $text.Contains($newPantheon)) {
            throw 'Pantheon checkout contract not found in scientific executor'
          }

          if ($text -notmatch [regex]::Escape($expected)) { throw 'failed to align harness pin in executor' }
          if (-not $text.Contains($newPantheon)) { throw 'failed to enforce canonical Pantheon checkout bytes' }
          Set-Content $script $text -Encoding utf8
          Write-Host 'Harness SHA and Pantheon canonical Git-byte policy aligned; scientific hashes/tolerances unchanged.'
      - name: Run G09-G14 scientific closure
        shell: pwsh
        run: |
          $py = Join-Path $env:RUNNER_TEMP 'Python-3.12.13\PCbuild\amd64\python.exe'
          $work = Join-Path $env:RUNNER_TEMP 'ascom00323-scientific-closure'
          & $py scripts\run_r1_scientific_closure_v2.py --repo $PWD --work $work --receipts results\r1-scientific
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload scientific closure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascom-00323-r1-scientific-${{ github.run_id }}
          path: |
            results/r1-scientific
            results/r1-action
          if-no-files-found: warn

# Validation trigger: 2026-09-03 publication-readiness closure.
