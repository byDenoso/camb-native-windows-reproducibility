name: peer-axion-twofield-like-015

on:
  push:
    branches:
      - science/peer-axion-twofield-like-015
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run 015 contract tests
        run: pytest -q tests/test_peer_axion_twofield_like_015.py
