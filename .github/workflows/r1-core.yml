name: r1-core-cleanroom

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1-core.yml'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'environment/**'
      - 'manifests/**'
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-windows-core:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Windows R1 core battery
        shell: pwsh
        run: ./scripts/run_r1_core.ps1
      - name: Upload R1 core receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascom-00323-r1-core-${{ github.run_id }}
          path: results/r1-action
          if-no-files-found: warn

