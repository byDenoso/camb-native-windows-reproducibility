name: r1-core-cleanroom

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1-core.yml'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'environment/**'
      - 'manifests/**'
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-windows-core:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare receipt directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path results/r1-action | Out-Null
          New-Item -ItemType Directory -Force -Path .r1 | Out-Null

      - name: Download and verify CPython 3.12.13 source
        shell: pwsh
        run: |
          $url = 'https://www.python.org/ftp/python/3.12.13/Python-3.12.13.tgz'
          $archive = Join-Path $env:RUNNER_TEMP 'Python-3.12.13.tgz'
          curl.exe -L --fail --retry 5 --retry-delay 2 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'CPython source download failed' }
          $expected = '0816c4761c97ecdb3f50a3924de0a93fd78cb63ee8e6c04201ddfaedca500b0b'
          $observed = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($observed -ne $expected) { throw "CPython source hash mismatch: $observed" }
          @{schema='ascom-00323-python-source/v1'; version='3.12.13'; source_url=$url; sha256=$observed; status='verified'} |
            ConvertTo-Json | Set-Content results/r1-action/python-source.json
          tar.exe -xf $archive -C $env:RUNNER_TEMP

      - name: Build CPython 3.12.13 from official source
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'Python-3.12.13'
          Push-Location $src
          try {
            & .\PCbuild\build.bat -p x64 -c Release
            if ($LASTEXITCODE -ne 0) { throw "CPython build failed with exit $LASTEXITCODE" }
          } finally { Pop-Location }
          $py = Join-Path $src 'PCbuild\amd64\python.exe'
          if (-not (Test-Path $py)) { throw "built python missing: $py" }
          $version = (& $py -c "import platform; print(platform.python_version())").Trim()
          if ($version -ne '3.12.13') { throw "expected Python 3.12.13, got $version" }
          "R1_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install exact public Python dependencies
        shell: pwsh
        run: |
          & $env:R1_PYTHON -m ensurepip --upgrade
          & $env:R1_PYTHON -m pip install --upgrade pip setuptools wheel
          & $env:R1_PYTHON -m pip install pytest==9.0.3 numpy==2.4.4 scipy==1.17.1 PyYAML==6.0.3
          & $env:R1_PYTHON -m pip install cobaya==3.6.2 mpi4py==4.1.2 sacc==2.1.2 getdist==1.7.7 astropy==7.2.0

      - name: Reconstruct historical CAMB wheel identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .r1/wheelhouse | Out-Null
          & $env:R1_PYTHON -m pip download camb==1.6.6 --only-binary=:all: --no-deps -d .r1/wheelhouse
          if ($LASTEXITCODE -ne 0) { throw 'CAMB wheel download failed' }
          $wheel = Get-ChildItem .r1/wheelhouse/camb*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'CAMB wheel not found' }
          $hash = (Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '4e38c3771329b2d4f5c185f8d8d7a0f183178d5b07957f18f9008f90e7d4b79d'
          $status = if ($hash -eq $expected) {'verified'} else {'mismatch'}
          @{schema='ascom-00323-camb-wheel/v1'; version='1.6.6'; file=$wheel.Name; sha256=$hash; expected_sha256=$expected; status=$status} |
            ConvertTo-Json | Set-Content results/r1-action/camb-wheel.json
          if ($hash -ne $expected) { throw "CAMB wheel hash mismatch: $hash" }
          & $env:R1_PYTHON -m pip install $wheel.FullName

      - name: Verify upstream CAMB provenance commit exists
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/cmbant/CAMB.git .r1/CAMB-source
          Push-Location .r1/CAMB-source
          try {
            git checkout --detach 3ef0272d6f7ba1231128872e56e6d4c12af8267b
            if ($LASTEXITCODE -ne 0) { throw 'CAMB source commit checkout failed' }
            $head = (git rev-parse HEAD).Trim()
            if ($head -ne '3ef0272d6f7ba1231128872e56e6d4c12af8267b') { throw "CAMB commit mismatch: $head" }
          } finally { Pop-Location }
          @{schema='ascom-00323-camb-source-provenance/v1'; commit='3ef0272d6f7ba1231128872e56e6d4c12af8267b'; status='verified'} |
            ConvertTo-Json | Set-Content results/r1-action/camb-source.json

      - name: Exact environment doctor
        shell: pwsh
        run: |
          & $env:R1_PYTHON scripts/doctor.py --strict --output results/r1-action/doctor.json
          if ($LASTEXITCODE -ne 0) { throw 'strict environment doctor failed' }

      - name: Public harness suite on exact Python
        shell: pwsh
        run: |
          & $env:R1_PYTHON -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed' }
          & $env:R1_PYTHON scripts/verify_artifact.py
          if ($LASTEXITCODE -ne 0) { throw 'artifact verification failed' }

      - name: Deterministic CAMB repeatability probe
        shell: pwsh
        run: |
          & $env:R1_PYTHON scripts/r1_core_probe.py --receipt results/r1-action/camb-repeatability.json
          if ($LASTEXITCODE -ne 0) { throw 'CAMB repeatability probe failed' }

      - name: Download official ACT DR6 CMB-only data
        shell: pwsh
        run: |
          $url = 'https://lambda.gsfc.nasa.gov/data/act/pspipe/sacc_files/dr6_data_cmbonly.tar.gz'
          $archive = Join-Path $env:RUNNER_TEMP 'dr6_data_cmbonly.tar.gz'
          curl.exe -L --fail --retry 5 --retry-delay 2 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'ACT public data download failed' }
          $dest = Join-Path $env:RUNNER_TEMP 'act-public'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          tar.exe -xf $archive -C $dest
          $fits = Get-ChildItem -Path $dest -Recurse -Filter dr6_data_cmbonly.fits | Select-Object -First 1
          if (-not $fits) { throw 'ACT FITS not found after extraction' }
          "R1_ACT_FITS=$($fits.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reconstruct ACT deterministic payload from public FITS
        shell: pwsh
        run: |
          & $env:R1_PYTHON scripts/act_public_payload.py $env:R1_ACT_FITS --output .r1/act_dr6_cmbonly.bin --receipt results/r1-action/act-public-reconstruction.json
          if ($LASTEXITCODE -ne 0) { throw 'ACT public reconstruction did not match frozen hashes' }

      - name: Relocation smoke
        shell: pwsh
        run: |
          $relocated = Join-Path $env:RUNNER_TEMP ('ascom00323-relocated-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $relocated | Out-Null
          Get-ChildItem -Force | Where-Object {$_.Name -ne '.git'} | ForEach-Object { Copy-Item $_.FullName -Destination $relocated -Recurse -Force }
          Push-Location $relocated
          try {
            & $env:R1_PYTHON -m pytest -q
            if ($LASTEXITCODE -ne 0) { throw 'relocated pytest failed' }
            & $env:R1_PYTHON scripts/verify_artifact.py
            if ($LASTEXITCODE -ne 0) { throw 'relocated artifact verification failed' }
          } finally { Pop-Location }
          @{schema='ascom-00323-relocation-smoke/v1'; relocated_path='${RUNNER_TEMP}/ascom00323-relocated-${GITHUB_RUN_ID}'; status='verified'} |
            ConvertTo-Json | Set-Content results/r1-action/relocation.json

      - name: Core battery summary
        if: always()
        shell: pwsh
        run: |
          $summary = [ordered]@{
            schema='ascom-00323-r1-core-battery/v1'
            run_id=$env:GITHUB_RUN_ID
            commit=$env:GITHUB_SHA
            runner_os=$env:RUNNER_OS
            evidence_policy='Only receipts produced in this clean-room run may be promoted.'
          }
          $summary | ConvertTo-Json | Set-Content results/r1-action/run-summary.json
          Get-ChildItem results/r1-action -ErrorAction SilentlyContinue | Format-Table Name,Length

      - name: Upload R1 core receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascom-00323-r1-core-${{ github.run_id }}
          path: results/r1-action
          if-no-files-found: warn
