name: r1-robustness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1-robustness.yml'
      - 'scripts/run_r1_robustness.py'
      - 'scripts/run_r1_robustness_v2.py'
      - 'scripts/run_r1_robustness_v3.py'
      - 'scripts/pantheon_cross_platform.py'
      - 'scripts/run_r1_core.ps1'
      - 'scripts/r1_core_probe.py'
      - 'scripts/run_r1_scientific_closure.py'
      - 'r1_scientific_harness/**'
      - 'src/**'
      - 'validation/robustness_matrix.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-robustness:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact CPython 3.12.13 and public R1 payloads
        shell: pwsh
        run: ./scripts/run_r1_core.ps1
      - name: Preserve CAMB-compatible numerical stack for adversarial replay
        shell: pwsh
        run: |
          $py = Join-Path $env:RUNNER_TEMP 'Python-3.12.13\PCbuild\amd64\python.exe'
          # Scientific closure separately certifies the historical 2.5.1/1.18.0 stack.
          # Robustness includes fresh CAMB subprocess probes, so preserve the exact
          # NumPy/SciPy pair already proven compatible by run_r1_core.ps1.
          & $py -m pip install psutil==7.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -c "import numpy, scipy, pandas, psutil; assert numpy.__version__=='2.4.4'; assert scipy.__version__=='1.17.1'; assert pandas.__version__=='3.0.5'; assert psutil.__version__=='7.0.0'; print(numpy.__version__, scipy.__version__, pandas.__version__, psutil.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Authoritative adversarial run: source and data identities are validated fail-closed before R01-R16.
      - name: Execute adversarial robustness battery
        shell: pwsh
        run: |
          $py = Join-Path $env:RUNNER_TEMP 'Python-3.12.13\PCbuild\amd64\python.exe'
          $work = Join-Path $env:RUNNER_TEMP 'ascom00323 robustness ç'
          & $py scripts\run_r1_robustness_v3.py --repo $PWD --work $work --receipts results\r1-robustness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload robustness receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascom-00323-r1-robustness-${{ github.run_id }}
          path: |
            results/r1-robustness
            results/r1-action
          if-no-files-found: warn
