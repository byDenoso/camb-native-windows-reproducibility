[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "native-windows-camb-repro"
version = "0.1.0"
description = "Reproducibility and validation harness for ASCOM-D-26-00323"
requires-python = ">=3.12,<3.13"
authors = [{name = "Dener Pereira"}]
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
